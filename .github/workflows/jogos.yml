name: Jogos gratis
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node avisar.mjs
        env:
          GOLIVE_WEBHOOK: ${{ secrets.GOLIVE_WEBHOOK }}
      - if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add enviados.json
          git diff --staged --quiet || (git commit -m "atualiza" && git push)
